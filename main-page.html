<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker | Home</title>

    <!-- fav icon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />
    <!-- daisyUI + tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC]">
    <header class="">
      <div class="navbar shadow-sm">
        <div class="flex-1">
          <a class="btn btn-ghost text-xl">
            <img src="./assets/github-logo.png" class="h-10 w-10" alt="" />
            GitHub Issues Tracker
          </a>
        </div>
        <div class="flex gap-2">
          <input
            id="search-input"
            type="text"
            placeholder="Search Issues..."
            class="input input-bordered w-24 md:w-auto"
          />
          <button id="search-btn" class="btn btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i>Search
          </button>
        </div>
      </div>
    </header>
    <section class="w-11/12 mx-auto mt-10">
      <!-- buttons -->
      <div class="shadow-md flex gap-2 justify-start p-6 bg-white rounded-xl">
        <button id="all-btn" class="btn py-3 px-10">All</button>
        <button id="open-btn" class="btn py-3 px-8">Open</button>
        <button id="closed-btn" class="btn py-3 px-8">Closed</button>
      </div>
      <div class="bg-[#FBFBFB] shadow-md rounded-xl">
        <!-- issues -->
        <div
          class="my-10 shadow-md rounded-t-xl bg-white p-6 flex justify-between items-center"
        >
          <!-- issues count -->
          <div class="flex gap-2">
            <!-- issues image -->
            <div>
              <img
                src="./assets/Aperture.png"
                alt=""
                class="bg-purple-100 rounded-full p-2"
              />
            </div>
            <!-- issues content -->
            <div>
              <h2 class="text-xl"><span id="issue-count">0</span> Issues</h2>
              <p class="text-[#64748B]">Track and manage your project issues</p>
            </div>
          </div>
          <!-- circle container -->
          <div class="flex gap-4">
            <div class="flex gap-2 items-center">
              <span class="bg-green-500 p-2 rounded-full h-4 w-4"></span>
              <p>Open</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="bg-purple-500 p-2 rounded-full h-4 w-4"></span>
              <p>Closed</p>
            </div>
          </div>
        </div>
        <!-- card container -->

        <div
          id="all-issues-card-container"
          class="grid grid-cols-4 gap-4 p-6"
        ></div>
        <div
          id="open-issues-card-container"
          class="hidden grid-cols-4 gap-4 p-6"
        ></div>
        <div
          id="closed-issues-card-container"
          class="hidden grid-cols-4 gap-4 p-6"
        ></div>
        <div
          id="search-issues-card-container"
          class="hidden grid-cols-4 gap-4 p-6"
        ></div>
      </div>
      <!-- Open the modal using ID.showModal() method -->
      <dialog id="my_modal_1" class="modal">
        <div class="modal-box">
          <div id="issue-details-container"></div>

          <div class="modal-action">
            <form method="dialog">
              <!-- if there is a button in form, it will close the modal -->
              <button class="btn btn-primary">Close</button>
            </form>
          </div>
        </div>
      </dialog>
    </section>
    <script src="./scripts/main-page.js"></script>
  </body>
</html>
