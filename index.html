<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker | Login</title>

    <!-- daisyUI + tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- fav icon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <main class="w-11/12 mx-auto">
      <!-- login page -->
      <section class="flex justify-center min-h-[100vh] items-center">
        <fieldset class="fieldset rounded-box w-lg p-4 shadow-xl">
          <!-- logo -->
          <div class="flex justify-center">
            <img src="./assets/github-logo.png" alt="" />
          </div>
          <div class="text-center">
            <h2 class="text-2xl">GitHub Issues Tracker</h2>
            <p class="text-[#64748B] text-base">
              Sign in to manage your issues
            </p>
          </div>
          <!-- login form -->
          <label class="label text-black text-base">Username</label>
          <input
            id="username-input"
            type="text"
            class="input w-full"
            placeholder="Enter Username"
          />
          <p class="text-sm text-primary">Default: admin</p>

          <label class="label text-black text-base">Password</label>
          <input
            id="password-input"
            type="password"
            class="input w-full"
            placeholder="Enter Password"
          />
          <p class="text-sm text-primary">Default: admin123</p>

          <button id="sign-in-btn" class="btn btn-primary mt-4">Sign In</button>
          <div class="flex gap-1 justify-center items-center my-6">
            <hr class="border border-[#E4E4E7] flex-1" />
            <span class="text-base rounded-lg">OR</span>
            <hr class="border border-[#E4E4E7] flex-1" />
          </div>
          <div class="text-center">
            <h2 class="text-sm text-[#64748B] mb-2">Demo Credentials</h2>
            <div class="bg-base-200 py-5">
              <div class="flex gap-2 justify-center items-center">
                <h2 class="text-base">Username: admin</h2>
                <span id="copy-username" class="cursor-pointer"
                  ><i class="fa-solid fa-copy"></i
                ></span>
              </div>
              <div class="flex gap-2 justify-center items-center">
                <h2 class="text-base">Password: admin123</h2>
                <span id="copy-password" class="cursor-pointer"
                  ><i class="fa-solid fa-copy"></i
                ></span>
              </div>
            </div>
          </div>
        </fieldset>
      </section>
    </main>
    <script src="./scripts/index.js"></script>
  </body>
</html>
